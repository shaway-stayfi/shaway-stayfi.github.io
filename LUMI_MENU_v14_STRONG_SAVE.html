<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>شواي السطايفي — MENU</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@500;700;900&family=Cinzel:wght@600;700&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><style id="css">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--g1:#fff3c4;--g2:#f4c95d;--g3:#a8730f;--gl:255,160,50;--bg:#090504;--ink:#fdf3e3;--mut:#bfa585;--hr:0deg}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:120px}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,Tahoma,sans-serif}
body{position:relative;overflow-x:hidden;transition:background .8s}
body:before{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.7))}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px) hue-rotate(var(--hr));transition:filter 2.5s}
.aurora i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(var(--gl),.5),transparent 65%);animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:60vw;height:60vw;top:-10%;right:-5%}
.aurora i:nth-child(2){width:50vw;height:50vw;bottom:-10%;left:-10%;animation-duration:28s;animation-delay:-8s;background:radial-gradient(circle,rgba(var(--gl),.38),transparent 65%)}
.aurora i:nth-child(3){width:38vw;height:38vw;top:35%;left:35%;animation-duration:34s;animation-delay:-15s;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%)}
@keyframes drift{to{transform:translate(8vw,-6vh) scale(1.25) rotate(25deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.wrap{position:relative;z-index:4;max-width:1260px;margin:0 auto;padding:12px 14px 90px}
.gtext{background:linear-gradient(100deg,var(--g3) 0%,var(--g1) 30%,var(--g2) 50%,var(--g1) 70%,var(--g3) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 6s linear infinite}
@keyframes sweep{to{background-position:-250% 0}}
/* flame */
.flame{width:56px;height:70px;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(var(--gl),.95)) drop-shadow(0 0 40px rgba(var(--gl),.6))}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.96,1.07) skewX(2deg)}50%{transform:scale(1.04,.96) skewX(-2deg)}75%{transform:scale(.98,1.05) skewX(1deg)}}
/* intro */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,rgba(var(--gl),.4),#030201 72%);transition:opacity 1s,visibility 1s;text-align:center}
#intro.hide{opacity:0;visibility:hidden}
#intro .flame{width:110px;height:138px}
#intro h1{font-family:"Aref Ruqaa",serif;font-size:clamp(42px,11vw,92px);margin:14px 0 0;opacity:0;animation:rise 1.3s .5s forwards}
#intro p{font:700 14px Cinzel,serif;letter-spacing:.8em;color:var(--g2);opacity:0;animation:rise 1.3s 1s forwards;margin:6px 0 0;padding-inline-start:.8em}
@keyframes rise{from{opacity:0;transform:translateY(24px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
/* top */
.top{display:flex;justify-content:space-between;align-items:center}
.top .tabs{display:flex;gap:6px}
.top button{border:1px solid rgba(var(--gl),.45);background:rgba(0,0,0,.4);color:var(--g1);padding:7px 15px;border-radius:999px;font:700 13px Cairo;cursor:pointer;backdrop-filter:blur(6px)}
.top button.on{background:linear-gradient(135deg,var(--g2),var(--g3));color:#1a0e04;border-color:transparent;box-shadow:0 0 18px rgba(var(--gl),.5)}
#clk{font:700 15px Cinzel,serif;color:var(--g2);letter-spacing:.15em;direction:ltr}
.brand{text-align:center;padding:2px 0 10px;display:flex;flex-direction:column;align-items:center}
.ar{font-family:"Aref Ruqaa",serif;font-size:clamp(52px,11.5vw,112px);line-height:1.1;margin:0;filter:drop-shadow(0 0 20px rgba(var(--gl),.55)) drop-shadow(0 4px 0 rgba(0,0,0,.65))}
.tag{font:700 clamp(15px,2.6vw,26px) Cinzel,serif;letter-spacing:.9em;color:var(--g2);padding-inline-start:.9em;text-shadow:0 0 16px rgba(var(--gl),.8)}
.orn{display:flex;align-items:center;gap:14px;justify-content:center;margin-top:8px;color:var(--g2);font-size:16px;width:100%}
.orn:before,.orn:after{content:"";height:1px;width:min(28vw,260px);background:linear-gradient(90deg,transparent,var(--g2),transparent)}
/* nav */
.nav{position:sticky;top:calc(6px + env(safe-area-inset-top,0px));z-index:10;margin:6px 0 16px;padding:10px;border-radius:22px;background:rgba(18,10,6,.62);border:1px solid rgba(var(--gl),.35);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.nav input{width:100%;font:700 16px Cairo;padding:11px 16px;border-radius:14px;border:1px solid rgba(var(--gl),.35);background:rgba(0,0,0,.45);color:var(--g1);outline:none}
.nav input:focus{border-color:var(--g2);box-shadow:0 0 22px rgba(var(--gl),.5)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills a{flex:0 0 auto;padding:8px 16px;border-radius:999px;font-weight:900;font-size:14px;color:var(--g1);border:1px solid rgba(var(--gl),.4);cursor:pointer;background:rgba(var(--gl),.08);transition:all .25s}
.pills a:active,.pills a:hover{background:linear-gradient(135deg,var(--g2),var(--g3));color:#1a0e04}
/* promo */
.promo{margin:8px 0 18px;border-radius:22px;padding:15px 20px;text-align:center;font-weight:900;font-size:clamp(18px,3.2vw,32px);color:#1a0e04;position:relative;overflow:hidden;
background:linear-gradient(110deg,var(--g3),var(--g2),var(--g1),var(--g2),var(--g3));background-size:240% 100%;animation:sweep 4s linear infinite;
box-shadow:0 0 44px rgba(var(--gl),.5),inset 0 0 0 2px rgba(255,255,255,.4)}
/* hot strip */
.hl{font-family:"Aref Ruqaa",serif;font-size:28px;margin:4px 6px 8px}
.hots{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hots::-webkit-scrollbar{display:none}
.hotc{flex:0 0 min(70vw,240px);scroll-snap-align:start;border-radius:24px;padding:18px;position:relative;overflow:hidden;
background:linear-gradient(150deg,rgba(var(--gl),.28),rgba(20,12,7,.85) 60%);border:1px solid rgba(var(--gl),.55);box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 30px rgba(var(--gl),.22)}
.hotc:before{content:"🔥";position:absolute;font-size:90px;opacity:.12;left:-10px;bottom:-18px}
.hotc .t{font-size:12px;font-weight:900;color:var(--g1);opacity:.85}
.hotc .nm{font-size:22px;font-weight:900;margin:6px 0 2px}
.hotc .ds{font-size:12px;color:var(--mut);min-height:16px}
.hotc .pr{font:900 38px Cairo;color:var(--g2);direction:ltr;text-shadow:0 0 22px rgba(var(--gl),.8);margin-top:8px}
.hotc .pr small{font-size:14px;color:var(--mut);margin-inline-start:5px}
/* bento */
.bento{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;perspective:1300px;grid-auto-flow:dense}
.sec{position:relative;border-radius:30px;padding:20px 18px 12px;background:linear-gradient(160deg,rgba(44,26,13,.72),rgba(12,7,4,.8));border:1px solid rgba(var(--gl),.38);
box-shadow:0 20px 56px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 60px rgba(var(--gl),.07);backdrop-filter:blur(10px);
transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out,box-shadow .3s;animation:in .9s both}
.sec:nth-child(2){animation-delay:.12s}.sec:nth-child(3){animation-delay:.24s}.sec:nth-child(4){animation-delay:.36s}.sec:nth-child(5){animation-delay:.48s}
@keyframes in{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1}}
.sec:hover{box-shadow:0 26px 70px rgba(0,0,0,.7),0 0 46px rgba(var(--gl),.28),inset 0 1px 0 rgba(255,255,255,.18)}
.sec:before{content:"";position:absolute;inset:7px;border:1px solid rgba(var(--gl),.18);border-radius:24px;pointer-events:none}
.sec h2{margin:0 0 10px;text-align:center;font-family:"Aref Ruqaa",serif;font-size:clamp(30px,4.4vw,46px);line-height:1.3}
.sec h2 .ic{display:inline-block;margin-inline-start:10px;-webkit-text-fill-color:initial;animation:fl 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-3px) scale(1.12)}}
@media(min-width:900px){.sec.wide{grid-column:span 2}.sec.wide .list{column-count:2;column-gap:36px}.sec.wide .it{break-inside:avoid}}
.it{display:flex;align-items:flex-end;gap:8px;padding:9px 4px;border-radius:14px;position:relative}
.it .l{display:flex;flex-direction:column;min-width:0}
.it .n{font-size:clamp(17px,2.3vw,22px);font-weight:900}
.it .ds{font-size:12px;color:var(--mut);font-weight:500;margin-top:1px}
.it .d{flex:1;min-width:14px;border-bottom:2px dotted rgba(var(--gl),.4);transform:translateY(-7px)}
.it .p{font-weight:900;font-size:clamp(20px,2.7vw,26px);color:var(--g2);text-shadow:0 0 14px rgba(var(--gl),.7);direction:ltr;display:inline-block}
.it .p small{font-size:.5em;color:var(--mut);font-weight:700;margin-inline-start:4px}
.hot{font-size:11px;font-weight:900;color:#1a0e04;background:linear-gradient(135deg,var(--g1),var(--g2));padding:2px 9px;border-radius:999px;margin-inline-start:8px;vertical-align:middle;box-shadow:0 0 12px rgba(var(--gl),.7)}
.it.off .n{opacity:.4;text-decoration:line-through}
.it.off .ib{filter:grayscale(1);opacity:.45}.it.off .p{color:#ff6b6b;font-size:18px;text-shadow:none}
.it.flash{animation:fl2 4s ease-out}
.it.flash .p{animation:roll .9s cubic-bezier(.2,1.3,.3,1)}
@keyframes fl2{0%,30%{background:rgba(var(--gl),.5);box-shadow:0 0 40px rgba(var(--gl),.9);transform:scale(1.05)}100%{background:transparent;box-shadow:none;transform:none}}
@keyframes roll{0%{transform:translateY(120%) scale(.6);opacity:0;filter:blur(8px)}60%{transform:translateY(-12%) scale(1.25);opacity:1;filter:none}100%{transform:none}}
.foot{display:flex;flex-direction:column;align-items:center;gap:8px;margin:26px 0 6px;color:var(--mut);font-size:13px;text-align:center}
.qr{background:#fff;padding:9px;border-radius:16px;box-shadow:0 0 40px rgba(var(--gl),.55);line-height:0}
.empty{text-align:center;color:var(--mut);padding:40px 0;font-weight:700}
/* toast */
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-160%);z-index:60;padding:12px 22px;border-radius:18px;font-weight:900;color:#1a0e04;background:linear-gradient(110deg,var(--g3),var(--g1),var(--g2));box-shadow:0 0 44px rgba(var(--gl),.85);transition:transform .55s cubic-bezier(.2,1.2,.3,1);max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
/* ticker */
#ticker{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(46px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden;direction:ltr;border-top:1px solid rgba(var(--gl),.5);background:linear-gradient(180deg,rgba(20,12,6,.9),rgba(5,3,2,.97));backdrop-filter:blur(10px);display:none}
#ticker.on{display:block}
#ticker .tr{display:inline-flex;white-space:nowrap;height:46px;align-items:center;animation:tk 40s linear infinite;will-change:transform}
#ticker span{font:900 19px Cairo;color:var(--g1);padding:0 26px;text-shadow:0 0 12px rgba(var(--gl),.7);direction:rtl}
#ticker b{color:var(--g2)}
@keyframes tk{to{transform:translateX(-50%)}}
/* control */
.ctl .it{flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid rgba(var(--gl),.14);border-radius:0;font-size:16px}
.ctl input[type=number]{width:92px;font:900 18px Cairo;padding:9px 6px;border-radius:12px;border:1px solid rgba(var(--gl),.45);background:#150c07;color:var(--g1);direction:ltr;text-align:center}
.ctl input[type=text]{flex:1;min-width:150px;font:700 16px Cairo;padding:10px 12px;border-radius:12px;border:1px solid rgba(var(--gl),.45);background:#150c07;color:var(--g1)}
.ctl input.sm{font-size:13px!important;padding:7px 12px!important;flex:1 1 100%}
.b{border:0;border-radius:12px;padding:10px 14px;font:900 14px Cairo;cursor:pointer;background:linear-gradient(135deg,var(--g2),var(--g3));color:#1a0e04}
.b.g{background:#24150b;color:var(--g1);border:1px solid rgba(var(--gl),.45)}
.b.s{padding:9px 11px;min-width:42px}
.b.x{background:#3a1212;color:#ff9a9a;border:1px solid #7a2a2a}
.note{background:rgba(30,18,10,.75);border:1px dashed rgba(var(--gl),.5);border-radius:16px;padding:13px 15px;margin-bottom:16px;font-size:14px;line-height:1.9}
.chips{display:flex;gap:12px;flex-wrap:wrap;padding:8px 4px}
.chip{width:46px;height:46px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.chip.on{border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.6)}
.stk{position:sticky;bottom:60px;z-index:15;display:flex;justify-content:center;margin-top:18px}
.stk .b{padding:14px 30px;font-size:16px;box-shadow:0 0 30px rgba(var(--gl),.7)}
.status{position:relative;z-index:4;text-align:center;color:var(--mut);font-size:12px;padding:0 0 60px}
@media (prefers-reduced-motion:reduce){.gtext,.promo,.sec,.stg,.flame,.aurora i,#ticker .tr,.sec h2 .ic{animation:none}}

/* masterpiece additions */
.wrap{padding-bottom:140px}
.hero{margin:0 auto 4px;width:min(94vw,640px);filter:drop-shadow(0 10px 30px rgba(var(--gl),.35))}
.hero svg{width:100%;height:auto;display:block;overflow:visible}
.fk{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.4s ease-in-out infinite}
.coal{animation:coal 2.2s ease-in-out infinite alternate}
@keyframes coal{from{opacity:.5}to{opacity:1}}
.smk{animation:smk 6s ease-in infinite;filter:blur(2.5px);fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:0}
@keyframes smk{0%{transform:translateY(10px);opacity:0}30%{opacity:.3}100%{transform:translateY(-42px);opacity:0}}
.ib{flex:0 0 auto;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;align-self:center;margin-inline-end:4px;
background:radial-gradient(circle at 35% 30%,rgba(var(--gl),.32),rgba(0,0,0,.45));border:1px solid rgba(var(--gl),.4);box-shadow:inset 0 0 14px rgba(var(--gl),.2),0 6px 14px rgba(0,0,0,.4)}
.ib svg{width:36px;height:36px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.it:hover .ib svg{animation:wob .7s}
@keyframes wob{30%{transform:rotate(-10deg) scale(1.12)}60%{transform:rotate(8deg) scale(1.12)}}
.ha{position:absolute;left:10px;top:10px;width:64px;height:64px}.ha svg{width:100%;height:100%;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.hotc:before{display:none}
.qc{display:flex;align-items:center;gap:6px;align-self:center;margin-inline-start:6px}
.qc button{width:34px;height:34px;border-radius:12px;border:1px solid rgba(var(--gl),.55);background:linear-gradient(135deg,var(--g2),var(--g3));color:#1a0e04;font:900 20px/1 Cairo;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .15s}
.qc button:active{transform:scale(.85)}
.qc button.m{background:rgba(0,0,0,.4);color:var(--g1)}
.qc b{min-width:18px;text-align:center;font-weight:900;color:var(--g1)}
#cartbar{position:fixed;left:10px;right:10px;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:25;display:none;align-items:center;gap:10px;padding:10px 12px;border-radius:22px;
background:linear-gradient(110deg,rgba(var(--gl),.55),rgba(20,12,7,.92));border:1px solid rgba(var(--gl),.7);backdrop-filter:blur(18px);box-shadow:0 14px 50px rgba(0,0,0,.7),0 0 40px rgba(var(--gl),.4);max-width:640px;margin:0 auto;animation:in .5s both}
#cartbar.on{display:flex}
#cartbar .sm{flex:1;font-weight:900;font-size:15px;line-height:1.3}
#cartbar .sm small{display:block;color:var(--mut);font-weight:700;font-size:12px}
#cartbar .b{padding:12px 18px;font-size:15px}
.ready .sec,.ready .hotc{animation:none}

/* ===== table menu additions ===== */
.wrap{padding-bottom:150px}
.ownerbar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:35;display:flex;gap:8px;align-items:center}
.ownerbar .b{box-shadow:0 6px 24px rgba(0,0,0,.6),0 0 22px rgba(var(--gl),.45)}
.ownerbar .dirty{animation:pulse2 1.4s ease-in-out infinite}
@keyframes pulse2{50%{box-shadow:0 0 40px rgba(var(--gl),1)}}
.sheetbg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.62);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center}
.sheetp{width:min(100%,580px);max-height:93vh;overflow:auto;background:linear-gradient(170deg,#26160a,#0c0603);border:1px solid rgba(var(--gl),.55);border-radius:30px 30px 0 0;padding:18px 16px calc(26px + env(safe-area-inset-bottom,0px));animation:up .45s cubic-bezier(.2,1,.3,1);box-shadow:0 -20px 80px rgba(var(--gl),.25)}
@keyframes up{from{transform:translateY(100%)}}
.sheetp h3{margin:0 0 6px;font-family:"Aref Ruqaa",serif;font-size:32px;text-align:center}
.fld{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.fld label{font-size:13px;font-weight:900;color:var(--g1)}
.fld input,.fld textarea,.ow input[type=text],.ow input[type=number],.ow input[type=time],.ow textarea{font:700 16px Cairo;padding:11px 14px;border-radius:14px;border:1px solid rgba(var(--gl),.4);background:rgba(0,0,0,.45);color:var(--g1);outline:none;width:100%}
.fld input:focus,.fld textarea:focus,.ow input:focus,.ow textarea:focus{border-color:var(--g2);box-shadow:0 0 18px rgba(var(--gl),.4)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 8px;border-radius:14px;border:1px solid rgba(var(--gl),.4);background:rgba(0,0,0,.4);color:var(--g1);font:900 15px Cairo;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--g2),var(--g3));color:#1a0e04;border-color:transparent;box-shadow:0 0 20px rgba(var(--gl),.5)}
.sl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dotted rgba(var(--gl),.3);font-weight:700}
.sl .t{flex:1}.sl .pp{color:var(--g2);font-weight:900;direction:ltr}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:20px;margin:12px 0;color:var(--g2)}
a.big,button.big{display:block;width:100%;text-align:center;padding:16px;font:900 17px Cairo;border-radius:18px;border:0;cursor:pointer;text-decoration:none;background:linear-gradient(135deg,var(--g2),var(--g3));color:#1a0e04;box-shadow:0 0 30px rgba(var(--gl),.55);margin-top:8px}
button.big.g{background:rgba(0,0,0,.4);color:var(--g1);border:1px solid rgba(var(--gl),.45);box-shadow:none}
.nt{text-align:center;color:var(--mut);font-size:13px;line-height:1.9;white-space:pre-line;margin:22px 8px 6px}
/* owner panel */
.ow .tabsb{display:flex;gap:6px;overflow-x:auto;margin:6px 0 14px;scrollbar-width:none}
.ow .tabsb button{flex:1 0 auto;padding:11px 16px;border-radius:14px;border:1px solid rgba(var(--gl),.4);background:rgba(0,0,0,.4);color:var(--g1);font:900 14px Cairo;cursor:pointer}
.ow .tabsb button.on{background:linear-gradient(135deg,var(--g2),var(--g3));color:#1a0e04;border-color:transparent}
.ow .hint{background:rgba(30,18,10,.75);border:1px dashed rgba(var(--gl),.5);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.9}

function artKind(name,sid){
  var n=String(name);
  if(/كوكا|كانيت|حمود|ماء|مشروب|عصير/.test(n))return "can";
  if(/ميلونج/.test(n))return "plate";
  if(/سلطة/.test(n))return "salad";
  if(/[أا]ومليت|بيض/.test(n))return "egg";
  if(/فريت|بطاطا/.test(n))return "fries";
  if(/[أا]رز/.test(n))return "rice";
  if(/زيتون/.test(n))return "olives";
  if(/حمي?[صس]/.test(n))return "hummus";
  if(/سمان/.test(n))return "quail";
  if(/سكالوب/.test(n))return "escalope";
  if(/ملفوف/.test(n))return "roll";
  if(/كفتة/.test(n))return "kofta";
  if(/مرقاز|نقانق/.test(n))return "merguez";
  if(/[أا]ونتركوت|فيلي|رونيو|ستيك/.test(n))return "steak";
  if(/كوت/.test(n))return "chop";
  if(/كبدة/.test(n))return "liver";
  if(/كباب|قلب|بروشات|كويس|نوازات/.test(n))return "skewer";
  return {grill:"skewer",plates:"plate",half:"salad",bbq:"steak"}[sid]||"flame";
}

async function cloudWriteMenu(snapshot){
  for(var attempt=1;attempt<=3;attempt++){
    try{
      var r=await menuReq(menuConfigPath(),{method:"PATCH",body:JSON.stringify({fields:fv(snapshot).mapValue.fields})});
      if(r.ok)return true;
      var tx=await r.text();
      if(r.status===403)throw new Error("permission:"+tx);
      if(r.status===401)continue;
      if(attempt<3)await new Promise(function(res){setTimeout(res,700*attempt)});
    }catch(e){
      if(String(e.message).indexOf("permission:")===0)throw e;
      if(attempt<3)await new Promise(function(res){setTimeout(res,700*attempt)});
    }
  }
  throw new Error("save_failed");
}

function fv(v){
  if(typeof v==="string")return {stringValue:v};
  if(typeof v==="number")return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(Array.isArray(v))return {arrayValue:{values:v.map(fv)}};
  var f={};Object.keys(v).forEach(function(k){f[k]=fv(v[k])});return {mapValue:{fields:f}};
}
function fd(x){
  if("stringValue" in x)return x.stringValue;
  if("integerValue" in x)return +x.integerValue;
  if("doubleValue" in x)return x.doubleValue;
  if("arrayValue" in x)return (x.arrayValue.values||[]).map(fd);
  if("mapValue" in x){var o={},f=x.mapValue.fields||{};Object.keys(f).forEach(function(k){o[k]=fd(f[k])});return o}
  return null;
}

  rs();addEventListener("resize",rs);
  function np(init){return {x:Math.random()*W,y:init?Math.random()*H:H+10,r:.6+Math.random()*2.2,vy:.3+Math.random()*1,vx:(Math.random()-.5)*.4,ph:Math.random()*6.28,a:.3+Math.random()*.7}}

    for(var i=0;i<ps.length;i++){var p=ps[i];p.y-=p.vy;p.x+=p.vx+Math.sin(t/900+p.ph)*.35;
